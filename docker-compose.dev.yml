services:
  redis:
    image: redis:7
    container_name: spletka-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: spletka-postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    healthcheck:
      interval: 2s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: spletka-backend
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=appdb
      - DB_SSL=false
      - JWT_SECRET=uYVD12Q77qC4yCy9e8k3gIkV6vjVJQO5UtdF8MZpPcQdo18JxX
      
      - R2_ACCOUNT_ID=REQUIRED
      - R2_ACCESS_KEY_ID=REQUIRED
      - R2_SECRET_ACCESS_KEY=REQUIRED
      - R2_BUCKET_NAME=REQUIRED
      - R2_ENDPOINT=REQUIRED
      - R2_PUBLIC_URL=http://localhost:8081
      - MAX_FILE_SIZE=5242880
      
      - SMTP_HOST=smtp-relay.brevo.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_FROM_NAME=SPLETKA
      - SMTP_FROM_ADDRESS=REQUIRED
      - SMTP_RECEIVE_ADDRESS=REQUIRED
      - SMTP_USER=REQUIRED
      - SMTP_PASS=REQUIRED

      - REDIS_HOST=spletka-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=LP6VhQiRaT6mR6p4
      - ADMIN_PASSWORD=$2y$10$6pWRWj7x7wb/.1R1UwXA.u8Avuvj9zNMnksgEvfshkFzU/vcCQ2jW
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: spletka-frontend
    environment:
      - API_URL=http://localhost:3000
    ports:
      - "8080:80"
    volumes:
      - ./frontend/conf.d.dev:/etc/nginx/conf.d:ro
    depends_on:
      - backend

  images-mock:
    image: nginx:alpine
    container_name: spletka-images-mock
    volumes:
      - ./images-mock/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./images-mock/placeholder.svg:/usr/share/nginx/html/placeholder.svg:ro
    ports:
      - "8081:80"
    networks:
      - web

  certbot:
    entrypoint: ["sh", "-c", "echo 'certbot disabled in dev' && sleep infinity"]
    restart: "no"