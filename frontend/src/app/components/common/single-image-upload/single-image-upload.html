<div class="flex flex-col gap-2">

  @if(title()){
    <div class="lora-500 text-sm text-(--secondary-color)">
      {{title()}} <span class="text-[#DC2626] font-semibold">{{ required() ? '*' : '' }}</span>
      @if(helper()){
        <span class="lora-400 text-(--secondary-color) text-md">
          {{ helper()}}
        </span>
      }
    </div>
  }

  <div
    role="button"
    tabindex="0"
    (click)="triggerFileSelect()"
    (keydown)="onKeyDown($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    [attr.aria-label]="label()"

    class="relative w-full min-w-0 min-h-[220px]
           rounded-xl border-2 border-dashed
           border-[var(--secondary-color)]
           transition-all duration-200
           overflow-hidden
           flex items-center justify-center text-center
           cursor-pointer select-none"

    [class.ring-2]="isFocused()"
    [class.ring-[var(--secondary-color)]]="isFocused()"
    [class.ring-offset-2]="isFocused()"
  >

    @if (displayUrl(); as url) {
      <img
        [src]="url"
        alt="Uploaded image preview"
        class="absolute inset-0 w-full h-full max-w-full max-h-full object-contain pointer-events-none"
      />

      <div
        class="absolute inset-0 bg-black/40 opacity-0
               hover:opacity-100 focus-within:opacity-100
               transition-opacity duration-200
               flex items-center justify-center"
      >
        <span class="text-sm lora-400 font-medium text-white">
          {{ getImageChangeText() }}
        </span>
      </div>

    } @else {

      <div class="px-6 py-8 flex flex-col items-center gap-2 max-w-full">
        <h3 class="text-lg lora-500 text-(--primary-color)">
          {{ label() }}
        </h3>

        <p class="text-sm lora-400 text-(--secondary-color)">
          {{ placeholder() }}
        </p>

        <span class="text-xs lora-400 text-(--primary-color)">
          {{ getImageSelectText() }}
        </span>
      </div>
    }

    <input
      #fileInput
      type="file"
      accept="image/png,image/jpeg,image/jpg"
      class="hidden"
      (change)="onFileChange($event)"
    />
  </div>

  @if (errorMessage()) {
    <p class="text-xs text-(--primary-color) break-words">
      {{ errorMessage() }}
    </p>
  }

</div>
