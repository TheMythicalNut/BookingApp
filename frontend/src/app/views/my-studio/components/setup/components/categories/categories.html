<section class="setup-section"
style="background-color: transparent; box-shadow: none;">
  <div class="bg-white shadow-md rounded-2xl p-4 lora-400 text-(--primary-color)">
    <h2 class="lora-500 text-xl tracking-tight text-(--primary-color) mb-1">{{ getTitle() }}</h2>
    <p class="helper lora-400 text-sm leading-3 text-(--secondary-color) mb-1"> {{ getPar1() }} </p>
    
    <app-error-message
    class="grid transition-all duration-300 overflow-hidden"
    [class.grid-rows-[0fr]]="!viewInvalid()"
    [class.grid-rows-[1fr]]="viewInvalid()"
    [title]="errorTitle()"
    [body]="errorBody()">
    </app-error-message>
  </div>
    
  <div 
    cdkDropList
    [cdkDropListData]="categories()"
    (cdkDropListDropped)="onCategoryDrop($event)"
    class="flex flex-col gap-4 w-full">

    @for (c of categories(); track c.localID; let categoryIndex = $index) {
    <div
      cdkDrag
      cdkDragLockAxis="y"
      style="touch-action: pan-y;"
      class="relative w-full rounded-2xl border border-neutral-200 bg-white p-4 shadow-sm
            transition-all duration-200 hover:shadow-md hover:ring-1 hover:ring-neutral-300
            cdk-drag-animating"
      [class.border-red-500]="hasErrorIndex()[categoryIndex]">


      <ng-template cdkDragPreview>
        <div class="w-full rounded-2xl border-2 border-(--primary-color) bg-white p-4 shadow-xl 
                    opacity-90 rotate-2 scale-105">
          <div class="flex items-center gap-3">
            <span class="text-neutral-400 text-lg">⋮⋮</span>
            <span class="font-medium text-(--primary-color)">{{ c.name || getCategoryText() + ' ' + (categoryIndex + 1) }}</span>
          </div>
        </div>
      </ng-template>

      <ng-template cdkDragPlaceholder>
        <div class="w-full rounded-2xl border-2 border-dashed border-neutral-300 bg-neutral-100 p-4 
                    opacity-100 min-h-[120px]">
        </div>
      </ng-template>

      <!-- Header -->
      <div class="flex items-start justify-between mb-4">
        <div class="flex flex-row gap-1">  
          <!-- Drag Handle -->
          <div
            cdkDragHandle
            style="touch-action: none;"
            class="cursor-grab active:cursor-grabbing select-none text-neutral-400
                  flex items-center justify-center px-2 py-2 rounded-lg border border-neutral-200 bg-white shadow-sm">
            <span class="text-lg leading-none">⋮⋮</span>
          </div>

          <div class="flex flex-col">
            <span class="text-sm font-medium text-neutral-500">
              {{ getCategoryText() + ' ' + (categoryIndex + 1) }}
            </span>
            <span class="text-xs text-neutral-400">
              {{ getDragHelperText() }}
            </span>
          </div>
        </div>

        <button
          type="button"
          aria-label="Remove Category"
          (click)="removeCateogry(categoryIndex)"
          class="h-5 w-5 rounded-full border border-red-200 bg-white text-red-500
                flex items-center justify-center shadow-sm cursor-pointer
                transition-all duration-200 hover:bg-red-50 hover:scale-105
                focus:outline-none focus:ring-2 focus:ring-red-500">
          ✕
        </button>
      </div>

      <!-- Content -->
      <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-end">

        <!-- Category Field -->
        <div class="flex-1 w-full">
          <app-text-field
            class="w-full"
            [init]="c.name"
            [title]="getCategoryTitleText()"
            (onChange)="setCategory(categoryIndex, $event)">
          </app-text-field>
        </div>

      </div>

    </div>
    }

  </div>


  <div class="flex flex-col items-center gap-2 mt-2">
      <app-request-status-message
      [status]="requestStatus()">
      </app-request-status-message>

      <app-button
      [idleText]="getAddButtonText()"
      [type]="'secondary'"
      (action)="addCategory()">
      </app-button>

      <app-button
      [disabled]="viewInvalid()"
      [idleText]="getSaveButtonText()"
      [type]="'outline'"
      (action)="save()">
      </app-button>

      <app-button
      [idleText]="getNextButtonText()"
      (action)="next.emit()">
      </app-button>
  </div>
</section>
