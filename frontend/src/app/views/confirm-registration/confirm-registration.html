@switch (requestStatus()) {
    @case('success'){
        <div class="w-full h-100 flex flex-col gap-3 lora-400 items-center justify-center text-(--primary-color)">
            <div class="text-center lora-500 text-2xl">{{'MY_STUDIO.CONFIRMED.TITLE' | translate}}</div>
            <div class="text-center"> {{'MY_STUDIO.CONFIRMED.BODY' | translate}} {{ requestOwner()?.email }}</div>
            <button 
            class="w-24 h-5 bg-gradient-to-r from-gray-900 to-black text-white font-medium rounded-md text-center overflow-hidden
                transition-all duration-300 ease-out
                focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2
                active:scale-95 active:shadow-inner active:brightness-90
                group transform cursor-pointer"
            (click)="navigateLogin()">
            <!-- Button content -->
            <span class="flex items-center justify-center">{{'BUTTON.LOGIN' | translate}}</span>
            </button>
        </div>
    }
    @case('error'){
        <div class="flex flex-col justify-center items-center min-h-screen">
            <div class="text-red-500 text-lg text-center">{{'ERRORS.CONFIRM_REGISTRATION_FAILED' | translate}}</div>
            <div class="text-red-500 text-lg text-center">{{'ERRORS.CONTACT_US' | translate}}</div>
        </div>

    }
    @case('loading'){
        <app-spinner class="flex justify-center h-[calc(100dvh)]"></app-spinner>
    }
}
