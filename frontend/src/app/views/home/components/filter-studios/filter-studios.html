@if(active()){
<div class="sticky top-6 bg-white p-1 transition-all z-10 duration-500 ease-in-out">
    <div class="filter-layout"
        [class.open]="expanded()">
        <div class="sticky top-0 flex flex-col gap-2 w-full filter-content"
            [class.visible-flex]="expanded()"
            [class.hidden-flex]="!expanded()">
            
            <app-text-input 
            [value]="search()"
            [placeholder]="searchPlaceholder()"
            [leadingIcon]="'search'"
            (changed)="searchChange($event)"
            [class.reveal-search-filter]="expanded()"
            [class.hide-search-filter]="!expanded()">
            </app-text-input>

            <div class="flex flex-row gap-2 ps-2 overflow-x-auto whitespace-nowrap scrollbar-none z-0"
                [class.reveal-service-type]="expanded()"
                [class.hide-service-type]="!expanded()">
                @for (type of studioTypes; track $index) {
                <div class="roboto-400 transition-all duration-400 cursor-pointer hover:text-(--primary-color)" (click)="selectType(type)"
                    [class.text-(--secondary-color)]="!isSelectedType()(type)"
                    [class.text-(--primary-color)]="isSelectedType()(type)"
                    [class.roboto-500]="isSelectedType()(type)">
                        {{getStudioType(type)}}
                </div>
                }
            </div>
        </div>
    </div>

    <div class="filter-layout"
        [class.open]="!expanded()">
        <div class="sticky top-0 flex flex-col gap-0.5 lora-400 text-(--primary-color) filter-content cursor-default" 
            [class.reveal-filter-info]="!expanded()"
            [class.hide-filter-info]="expanded()">
            @if(search() !== '') { 
                <div>
                    {{search()}}
                </div>
            }
            @if(type()) 
            { 
                <div>
                    {{ getTypeName() }}
                </div>
            }
        </div>
    </div>
</div>
}
